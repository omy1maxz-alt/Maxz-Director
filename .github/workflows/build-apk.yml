name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies and Build Web App
        run: |
          npm ci
          npm run build

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configure Android Permissions
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          content = manifest_path.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
          ]

          additions = []
          for permission in permissions:
              declaration = (
                  f'    <uses-permission '
                  f'android:name="{permission}" />'
              )

              if declaration not in content:
                  additions.append(declaration)

          if additions:
              marker = "</manifest>"
              content = content.replace(
                  marker,
                  "\n".join(additions) + "\n" + marker,
                  1,
              )
              manifest_path.write_text(content)
          PY
          fi

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java Version
        run: |
          java -version
          javac -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MV-Director-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
